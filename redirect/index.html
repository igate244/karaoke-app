<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#120f18" />
<title>カラオケ持ち歌は引っ越しました</title>
<meta http-equiv="refresh" content="3; url=https://karaoke-mochiuta.web.app/" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120f18; color: #f3eef8;
    font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 16px; background: #ff4f8b; color: #1a0a12; font-weight: 700; padding: 12px 20px;
    border-radius: 12px; text-decoration: none; }
  p { color: #9b92aa; font-size: 14px; }
</style>
</head>
<body>
  <div>
    <h1>カラオケ持ち歌は引っ越しました</h1>
    <p>新しいアドレスに自動で移動します。<br>前のデータは、Googleドライブのバックアップから「設定 → 復元」で戻せます。</p>
    <a href="https://karaoke-mochiuta.web.app/">新しいアドレスを開く</a>
  </div>
  <script>
    // 古いService Workerを外して、旧アドレスでアプリが残らないようにする
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  </script>
</body>
</html>
