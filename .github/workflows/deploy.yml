# main に push されたら、テスト → ビルド → GitHub Pages に公開
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          # OAuthクライアントID（公開して問題ない値）。reading-log-igate プロジェクトの「読書記録 PWA」を共用。
          # GitHub の Variables に GOOGLE_CLIENT_ID を入れるとそちらが優先される
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '1090226469026-gjmdmd131d784g5d8k1er1mho3ihdu2b.apps.googleusercontent.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
